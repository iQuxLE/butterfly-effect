<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butterfly Effect Machine</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(78, 205, 196, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(255, 107, 107, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(192, 132, 252, 0.06) 0%, transparent 50%);
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
  }

  .header { text-align: center; margin-bottom: 2rem; }

  .header h1 {
    font-size: 2.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, #4ecdc4, #ff6b6b, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .header .butterfly-icon {
    font-size: 3rem;
    display: inline-block;
    animation: flutter 2s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.5));
  }

  @keyframes flutter {
    0%, 100% { transform: rotate(-5deg) scale(1); }
    50% { transform: rotate(5deg) scale(1.1); }
  }

  .header p { font-size: 1.1rem; color: #888; font-weight: 300; }

  .input-area {
    display: flex; gap: 1rem; margin-bottom: 1rem;
    max-width: 800px; margin-left: auto; margin-right: auto;
  }

  .input-area input {
    flex: 1; padding: 1rem 1.5rem; font-size: 1.1rem;
    font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; color: #fff; outline: none; transition: all 0.3s;
  }

  .input-area input:focus {
    border-color: rgba(78, 205, 196, 0.5);
    box-shadow: 0 0 20px rgba(78, 205, 196, 0.1);
  }

  .input-area input::placeholder { color: #555; }

  .input-area button {
    padding: 1rem 2rem; font-size: 1.1rem;
    font-family: 'Inter', sans-serif; font-weight: 600;
    background: linear-gradient(135deg, #4ecdc4, #45b7aa);
    border: none; border-radius: 12px; color: #0a0a0f;
    cursor: pointer; transition: all 0.3s; white-space: nowrap;
  }

  .input-area button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(78, 205, 196, 0.3); }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .examples { text-align: center; margin-bottom: 2.5rem; }
  .examples span { color: #555; font-size: 0.85rem; margin-right: 0.5rem; }

  .example-btn {
    display: inline-block; padding: 0.4rem 0.9rem; margin: 0.25rem;
    font-size: 0.8rem; font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; color: #999; cursor: pointer; transition: all 0.2s;
  }

  .example-btn:hover { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.15); }

  .agent-bar {
    display: flex; justify-content: center; gap: 1.5rem;
    margin-bottom: 1.5rem; flex-wrap: wrap;
  }

  .agent-chip {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem; border-radius: 20px;
    font-size: 0.85rem; font-weight: 500;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    opacity: 0.3; transition: all 0.5s;
  }

  .agent-chip.active {
    opacity: 1; border-color: var(--agent-color);
    box-shadow: 0 0 15px color-mix(in srgb, var(--agent-color) 30%, transparent);
  }

  .agent-chip.done { opacity: 0.7; }

  .agent-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent-color); }
  .agent-chip.active .dot { animation: pulse 1s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.5; }
  }

  #tree-container { width: 100%; position: relative; }
  #tree-svg { width: 100%; height: 800px; }

  .link { fill: none; stroke-width: 2.5; }
  .node-group { cursor: pointer; }
  .node-circle { transition: all 0.3s; }
  .node-group:hover .node-circle { filter: url(#glow-strong); }

  .node-label {
    font-family: 'Inter', sans-serif; font-size: 11.5px;
    fill: #ccc; text-anchor: middle;
  }

  .node-timeframe {
    font-family: 'Inter', sans-serif; font-size: 10px;
    fill: #555; text-anchor: middle;
  }

  /* Detail Panel */
  .detail-panel {
    position: fixed; top: 0; right: -450px; width: 420px; height: 100vh;
    background: rgba(15, 15, 25, 0.98);
    border-left: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); z-index: 200;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto; padding: 2rem;
  }

  .detail-panel.open { right: 0; }

  .detail-panel .close-btn {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #888; font-size: 1.2rem;
    width: 36px; height: 36px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-family: 'Inter', sans-serif;
  }

  .detail-panel .close-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .detail-panel .agent-badge {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.3rem 0.8rem; border-radius: 16px;
    font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem;
  }

  .detail-panel .prediction-text { font-size: 1.15rem; line-height: 1.6; color: #eee; margin-bottom: 1.5rem; }
  .detail-panel .meta-row { display: flex; gap: 1rem; margin-bottom: 1rem; }

  .detail-panel .meta-tag {
    padding: 0.3rem 0.7rem; border-radius: 8px; font-size: 0.75rem; font-weight: 500;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  }

  .detail-panel .chain-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.06); }

  .detail-panel .chain-title {
    font-size: 0.8rem; font-weight: 600; color: #666;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.8rem;
  }

  .detail-panel .chain-item {
    padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 0.85rem; color: #999;
    display: flex; align-items: flex-start; gap: 0.5rem;
  }

  .detail-panel .chain-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 0.4rem; flex-shrink: 0; }

  .confidence-high { background: rgba(78, 205, 196, 0.2); color: #4ecdc4; }
  .confidence-medium { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
  .confidence-low { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }

  .headline-display { text-align: center; margin-bottom: 1.5rem; display: none; }
  .headline-display.visible { display: block; }

  .headline-display h2 {
    font-size: 1.4rem; font-weight: 600; color: #fff;
    padding: 0.8rem 1.5rem; display: inline-block;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  }

  .headline-display h2::before { content: '\201C'; color: #4ecdc4; font-size: 1.8rem; vertical-align: -0.15em; margin-right: 0.2rem; }
  .headline-display h2::after { content: '\201D'; color: #4ecdc4; font-size: 1.8rem; vertical-align: -0.15em; margin-left: 0.2rem; }

  .loading-text { text-align: center; color: #555; font-size: 0.9rem; margin-top: 0.5rem; display: none; }
  .loading-text.visible { display: block; animation: fadeInOut 2s ease-in-out infinite; }

  @keyframes fadeInOut { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  .counter { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #444; display: none; }
  .counter.visible { display: block; }
  .counter span { color: #4ecdc4; font-weight: 600; }

  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 150;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }

  .overlay.visible { opacity: 1; pointer-events: all; }

  /* News Sidebar */
  .news-toggle {
    position: fixed; top: 1rem; left: 1rem; z-index: 100;
    padding: 0.5rem 1rem; font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 500;
    background: rgba(96, 165, 250, 0.15); border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: 20px; color: #60a5fa; cursor: pointer; transition: all 0.2s;
  }
  .news-toggle:hover { background: rgba(96, 165, 250, 0.25); }
  .news-toggle .badge {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    font-size: 0.7rem; font-weight: 700; text-align: center;
    background: #60a5fa; color: #0a0a0f; border-radius: 10px;
  }

  .news-sidebar {
    position: fixed; top: 0; left: 0; width: 300px; height: 100vh;
    background: rgba(15, 15, 25, 0.98); border-right: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); z-index: 200; overflow-y: auto;
    transform: translateX(-100%); transition: transform 0.3s ease; padding: 1.5rem;
  }
  .news-sidebar.open { transform: translateX(0); }

  .news-sidebar h3 {
    font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 1rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .news-sidebar .close-sidebar {
    background: none; border: none; color: #666; font-size: 1.4rem;
    cursor: pointer; padding: 0 4px; transition: color 0.2s;
  }
  .news-sidebar .close-sidebar:hover { color: #fff; }

  .news-item {
    padding: 0.8rem; margin-bottom: 0.5rem; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.2s;
  }
  .news-item:hover { background: rgba(255,255,255,0.07); border-color: rgba(96, 165, 250, 0.3); }
  .news-item .news-headline { font-size: 0.85rem; font-weight: 600; color: #e0e0e0; margin-bottom: 0.3rem; }
  .news-item .news-summary { font-size: 0.75rem; color: #888; line-height: 1.4; }
  .news-item .news-source { font-size: 0.65rem; color: #555; margin-top: 0.3rem; }

  .news-empty { text-align: center; color: #555; font-size: 0.85rem; padding: 2rem 0; }
  .news-loading { color: #60a5fa; }
</style>
</head>
<body>

<button class="news-toggle" id="news-toggle" onclick="toggleSidebar()">News Feed <span class="badge" id="news-badge">0</span></button>

<div class="news-sidebar" id="news-sidebar">
  <h3>Live News Feed <button class="close-sidebar" onclick="toggleSidebar()">&times;</button></h3>
  <div id="news-list">
    <div class="news-empty news-loading">Fetching latest news...</div>
  </div>
</div>

<div class="container">
  <div class="header">
    <div class="butterfly-icon">&#129419;</div>
    <h1>Butterfly Effect Machine</h1>
    <p>Enter a headline. Watch the dominoes fall.</p>
  </div>

  <div class="input-area">
    <input type="text" id="headline-input" placeholder="Enter a news headline..." />
    <button id="analyze-btn" onclick="analyze()">Trace the Ripples</button>
  </div>

  <div class="examples">
    <span>Try:</span>
    <button class="example-btn" onclick="setExample(this)">Supreme Court strikes down Trump's global tariffs</button>
    <button class="example-btn" onclick="setExample(this)">DOGE eliminates 20% of federal workforce with AI</button>
    <button class="example-btn" onclick="setExample(this)">OpenAI releases fully autonomous coding agent</button>
    <button class="example-btn" onclick="setExample(this)">EU bans all AI-generated content in advertising</button>
    <button class="example-btn" onclick="setExample(this)">China lands first humans on Mars</button>
  </div>

  <div class="headline-display" id="headline-display">
    <h2 id="headline-text"></h2>
  </div>

  <div class="agent-bar" id="agent-bar">
    <div class="agent-chip" id="chip-economist" style="--agent-color: #4ecdc4">
      <div class="dot"></div>Economist
    </div>
    <div class="agent-chip" id="chip-geopolitics" style="--agent-color: #ff6b6b">
      <div class="dot"></div>Geopolitical Strategist
    </div>
    <div class="agent-chip" id="chip-domestic" style="--agent-color: #ffd93d">
      <div class="dot"></div>Social Analyst
    </div>
    <div class="agent-chip" id="chip-longterm" style="--agent-color: #c084fc">
      <div class="dot"></div>Futurist
    </div>
  </div>

  <div class="loading-text" id="loading-text">Agents are analyzing the ripple effects...</div>

  <div id="tree-container">
    <svg id="tree-svg"></svg>
  </div>

  <div class="counter" id="counter">
    <span id="pred-count">0</span> cascading effects traced
  </div>
</div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<div class="detail-panel" id="detail-panel">
  <button class="close-btn" onclick="closePanel()">&times;</button>
  <div id="panel-content"></div>
</div>

<script>
const AGENT_ICONS = {
  economist: '\u{1F4CA}',
  geopolitics: '\u{1F30D}',
  domestic: '\u{1F465}',
  longterm: '\u{1F680}'
};

const AGENT_COLORS = {
  economist: '#4ecdc4',
  geopolitics: '#ff6b6b',
  domestic: '#ffd93d',
  longterm: '#c084fc'
};

// Each branch gets a consistent color throughout its entire chain
const BRANCH_COLORS = ['#4ecdc4', '#ff6b6b', '#ffd93d', '#c084fc'];

let treeData = null;
let svg, g;
let nodeId = 0;
let predCount = 0;

function initSVG() {
  const container = document.getElementById('tree-container');
  const width = container.clientWidth;
  const height = 800;

  d3.select('#tree-svg').selectAll('*').remove();
  svg = d3.select('#tree-svg').attr('width', width).attr('height', height);

  const defs = svg.append('defs');

  const filter = defs.append('filter')
    .attr('id', 'glow').attr('x', '-50%').attr('y', '-50%')
    .attr('width', '200%').attr('height', '200%');
  filter.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'coloredBlur');
  const fm = filter.append('feMerge');
  fm.append('feMergeNode').attr('in', 'coloredBlur');
  fm.append('feMergeNode').attr('in', 'SourceGraphic');

  const filter2 = defs.append('filter')
    .attr('id', 'glow-strong').attr('x', '-50%').attr('y', '-50%')
    .attr('width', '200%').attr('height', '200%');
  filter2.append('feGaussianBlur').attr('stdDeviation', '8').attr('result', 'coloredBlur');
  const fm2 = filter2.append('feMerge');
  fm2.append('feMergeNode').attr('in', 'coloredBlur');
  fm2.append('feMergeNode').attr('in', 'SourceGraphic');

  g = svg.append('g').attr('transform', `translate(${width / 2}, 50)`);
}

function setExample(btn) {
  document.getElementById('headline-input').value = btn.textContent;
}

function wrapText(text, maxChars) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    if ((current + ' ' + word).trim().length > maxChars && current) {
      lines.push(current.trim());
      current = word;
    } else {
      current = (current + ' ' + word).trim();
    }
  }
  if (current) lines.push(current.trim());
  return lines;
}

function truncate(text, max) {
  return text.length <= max ? text : text.substring(0, max - 3) + '...';
}

function renderTree() {
  if (!treeData) return;

  const container = document.getElementById('tree-container');
  const width = container.clientWidth;
  const height = 800;
  const offsetX = -(width / 2 - 100);

  const root = d3.hierarchy(treeData);
  const treeLayout = d3.tree()
    .size([width - 200, height - 150])
    .separation((a, b) => a.parent === b.parent ? 1.8 : 2.2);

  treeLayout(root);

  // --- LINKS ---
  const linkData = root.links();
  const links = g.selectAll('.link').data(linkData, d => `${d.source.data.id}-${d.target.data.id}`);

  links.enter()
    .append('path')
    .attr('class', 'link')
    .attr('d', d3.linkVertical().x(d => d.x + offsetX).y(d => d.y))
    .attr('stroke', d => d.target.data.branchColor || '#333')
    .attr('stroke-width', 2.5)
    .attr('opacity', 0)
    .transition().duration(600)
    .attr('opacity', 0.5);

  links.transition().duration(400)
    .attr('d', d3.linkVertical().x(d => d.x + offsetX).y(d => d.y));

  links.exit().remove();

  // --- NODES ---
  const nodeData = root.descendants();
  const nodes = g.selectAll('.node-group').data(nodeData, d => d.data.id);

  const enter = nodes.enter()
    .append('g')
    .attr('class', 'node-group')
    .attr('transform', d => `translate(${d.x + offsetX}, ${d.y})`)
    .style('opacity', 0)
    .on('click', (event, d) => { event.stopPropagation(); openPanel(d.data); });

  // Circle: fill = agent color, stroke = branch color
  enter.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d.data.isRoot ? 18 : 12)
    .attr('fill', d => d.data.color || '#fff')
    .attr('stroke', d => d.data.branchColor || d.data.color || '#fff')
    .attr('stroke-width', 2.5)
    .attr('fill-opacity', 0.2)
    .attr('filter', 'url(#glow)');

  // Icon
  enter.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('font-size', d => d.data.isRoot ? '16px' : '12px')
    .attr('pointer-events', 'none')
    .text(d => d.data.icon || '');

  // Label
  enter.each(function(d) {
    if (!d.data.label) return;
    const labelText = truncate(d.data.label, 55);
    const lines = wrapText(labelText, 22);
    const textEl = d3.select(this).append('text')
      .attr('class', 'node-label')
      .attr('y', d.data.isRoot ? 30 : 24)
      .attr('pointer-events', 'none');
    lines.forEach((line, i) => {
      textEl.append('tspan').attr('x', 0).attr('dy', i === 0 ? 0 : '1.2em').text(line);
    });
  });

  // Timeframe
  enter.append('text')
    .attr('class', 'node-timeframe')
    .attr('y', d => {
      const lt = d.data.label ? truncate(d.data.label, 55) : '';
      const lines = lt ? wrapText(lt, 22).length : 0;
      return (d.data.isRoot ? 30 : 24) + lines * 14 + 2;
    })
    .attr('pointer-events', 'none')
    .text(d => d.data.timeframe || '');

  enter.transition().duration(500).style('opacity', 1);

  nodes.transition().duration(400)
    .attr('transform', d => `translate(${d.x + offsetX}, ${d.y})`);

  nodes.exit().remove();
}

function getAncestorChain(nodeData) {
  const chain = [];
  function findPath(node, target, path) {
    if (node.id === target.id) { chain.push(...path, node); return true; }
    if (node.children) {
      for (const child of node.children) {
        if (findPath(child, target, [...path, node])) return true;
      }
    }
    return false;
  }
  findPath(treeData, nodeData, []);
  return chain;
}

function openPanel(nodeData) {
  if (nodeData.isRoot) return;

  const chain = getAncestorChain(nodeData);
  const confidenceClass = `confidence-${nodeData.confidence || 'medium'}`;

  let chainHTML = '';
  if (chain.length > 1) {
    chainHTML = `
      <div class="chain-section">
        <div class="chain-title">Causal Chain</div>
        ${chain.map(n => `
          <div class="chain-item">
            <div class="chain-dot" style="background: ${n.color}"></div>
            <div>${n.isRoot ? ('<strong>' + n.fullText + '</strong>') : ((n.agentName ? '<em>' + n.agentName + ':</em> ' : '') + n.fullText)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="agent-badge" style="background: ${nodeData.color}20; color: ${nodeData.color}; border: 1px solid ${nodeData.color}40;">
      ${nodeData.icon || ''} ${nodeData.agentName || 'Analysis'}
    </div>
    <div class="prediction-text">${nodeData.fullText}</div>
    <div class="meta-row">
      ${nodeData.timeframe ? `<div class="meta-tag">${nodeData.timeframe}</div>` : ''}
      ${nodeData.confidence ? `<div class="meta-tag ${confidenceClass}">${nodeData.confidence} confidence</div>` : ''}
    </div>
    ${chainHTML}
  `;

  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}

function closePanel() {
  document.getElementById('detail-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

async function analyze() {
  const input = document.getElementById('headline-input');
  const btn = document.getElementById('analyze-btn');
  const headline = input.value.trim();
  if (!headline) return;

  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  predCount = 0;
  nodeId = 0;

  document.querySelectorAll('.agent-chip').forEach(c => c.classList.remove('active', 'done'));

  document.getElementById('headline-text').textContent = headline;
  document.getElementById('headline-display').classList.add('visible');
  document.getElementById('loading-text').classList.add('visible');
  document.getElementById('counter').classList.add('visible');
  document.getElementById('pred-count').textContent = '0';

  treeData = {
    id: nodeId++,
    label: truncate(headline, 40),
    fullText: headline,
    color: '#fff',
    branchColor: '#fff',
    icon: '\u{1F98B}',
    isRoot: true,
    children: []
  };

  // Track the leaf node of each branch so we can append to it
  const branchLeaf = {};

  initSVG();
  renderTree();

  const url = `/analyze?headline=${encodeURIComponent(headline)}`;
  const evtSource = new EventSource(url);

  evtSource.addEventListener('agent_start', (e) => {
    const data = JSON.parse(e.data);
    const chip = document.getElementById(`chip-${data.agent_id}`);
    if (chip) chip.classList.add('active');
    document.getElementById('loading-text').textContent =
      `${data.agent_name} is analyzing ripple effects...`;
  });

  evtSource.addEventListener('prediction', (e) => {
    const data = JSON.parse(e.data);
    predCount++;
    document.getElementById('pred-count').textContent = predCount;

    const branchIdx = data.branch;
    const branchColor = BRANCH_COLORS[branchIdx] || '#fff';

    const newNode = {
      id: nodeId++,
      label: data.prediction,
      fullText: data.prediction,
      timeframe: data.timeframe,
      confidence: data.confidence,
      color: AGENT_COLORS[data.agent_id] || data.color,
      branchColor: branchColor,
      icon: AGENT_ICONS[data.agent_id] || '',
      agentName: data.agent_name,
      children: []
    };

    if (data.depth === 0) {
      // First agent: attach directly to root
      treeData.children.push(newNode);
      branchLeaf[branchIdx] = newNode;
    } else {
      // Subsequent agents: attach to the current leaf of this branch
      const parent = branchLeaf[branchIdx];
      if (parent) {
        parent.children.push(newNode);
        branchLeaf[branchIdx] = newNode;
      }
    }

    renderTree();
  });

  evtSource.addEventListener('agent_done', (e) => {
    const data = JSON.parse(e.data);
    const chip = document.getElementById(`chip-${data.agent_id}`);
    if (chip) { chip.classList.remove('active'); chip.classList.add('done'); }
  });

  evtSource.addEventListener('complete', () => {
    evtSource.close();
    btn.disabled = false;
    btn.textContent = 'Trace the Ripples';
    document.getElementById('loading-text').classList.remove('visible');
  });

  evtSource.addEventListener('error', () => {
    evtSource.close();
    btn.disabled = false;
    btn.textContent = 'Trace the Ripples';
    document.getElementById('loading-text').classList.remove('visible');
  });
}

// --- News Feed ---
let sidebarOpen = false;

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('news-sidebar').classList.toggle('open', sidebarOpen);
}

function useHeadline(text) {
  document.getElementById('headline-input').value = text;
  sidebarOpen = false;
  document.getElementById('news-sidebar').classList.remove('open');
}

function renderNewsItems(items) {
  const list = document.getElementById('news-list');
  const badge = document.getElementById('news-badge');
  let html = '';
  let count = 0;
  for (const item of items) {
    if (item.headline) {
      count++;
      const escaped = (item.headline || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += `
        <div class="news-item" onclick="useHeadline('${escaped}')">
          <div class="news-headline">${item.headline}</div>
          <div class="news-summary">${item.summary || ''}</div>
          <div class="news-source">${item.source || ''}</div>
        </div>
      `;
    }
  }
  if (html) {
    list.innerHTML = html;
    badge.textContent = count;
  }
}

async function loadNewsFeed() {
  const list = document.getElementById('news-list');

  // 1) Fetch from Google (cached or first-time Gemini call)
  try {
    const resp = await fetch('/news');
    const data = await resp.json();
    console.log('[news] google:', data.source, data.headlines?.length || 0, 'items');
    if (data.headlines && data.headlines.length > 0) {
      renderNewsItems(data.headlines);
    } else {
      list.innerHTML = '<div class="news-empty">No headlines available.</div>';
    }
  } catch (e) {
    console.error('[news] google error:', e);
    list.innerHTML = '<div class="news-empty">Failed to load news.</div>';
  }

  // 2) Try Yutori in background (20s timeout), update if it returns
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    const resp = await fetch('/news/refresh', { signal: controller.signal });
    clearTimeout(timeout);
    const data = await resp.json();
    console.log('[news] yutori:', data.source, data.headlines?.length || 0, 'items');
    if (data.headlines && data.headlines.length > 0) {
      renderNewsItems(data.headlines);
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      console.log('[news] yutori timed out (20s), using google results');
    } else {
      console.error('[news] yutori error:', e);
    }
  }
}

loadNewsFeed();

document.getElementById('headline-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') analyze();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePanel();
});

window.addEventListener('resize', () => {
  if (treeData) { initSVG(); renderTree(); }
});
</script>
